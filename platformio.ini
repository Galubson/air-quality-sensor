; Projekt: Czujnik jakości powietrza (SPS30 + BME280 + SHT40) na XIAO ESP32S3
;
; UWAGA: nazwy/wersje bibliotek w PlatformIO Registry czasem się zmieniają.
; Jeśli któraś nie zainstaluje się pod podaną nazwą, wyszukaj ją w zakładce
; "Libraries" w PlatformIO (VS Code) po słowie kluczowym z komentarza obok.

[platformio]
; Tu wybierasz, co się buduje domyślnie (przycisk Upload w VS Code / `pio run`).
; Teraz masz fizycznie DevKitV1, więc zostaw devkit_v1. Gdy przesiądziesz się
; na docelowy XIAO ESP32S3, zmień tę jedną linijkę na xiao_esp32s3 - nic więcej
; nie trzeba ruszać. Możesz też zbudować/wgrać drugie środowisko bez zmiany
; tej linii, komendą: pio run -e xiao_esp32s3 -t upload
default_envs = xiao_esp32s3

[common]
lib_deps =
    tzapu/WiFiManager @ ^2.0.17          ; AP + captive portal do konfiguracji WiFi
    ESP32Async/ESPAsyncWebServer @ ^3.6.0 ; lokalny panel WWW (async, nieblokujący)
    ESP32Async/AsyncTCP @ ^3.3.2          ; wymagane przez ESPAsyncWebServer
    bblanchon/ArduinoJson @ ^7.2.0        ; JSON dla API i configu
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    paulvha/sps30                         ; sterownik SPS30 (I2C/UART) - szukaj "sps30" w Library Manager
    knolleary/PubSubClient @ ^2.8         ; MQTT (opcjonalna integracja z HA)
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_STD_STRING=1

; ---------- Płytka, na której teraz prototypujesz ----------
[env:devkit_v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DI2C_SDA_PIN=21   ; typowe piny I2C na ESP32-DevKitV1
    -DI2C_SCL_PIN=22

; ---------- Płytka docelowa ----------
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DI2C_SDA_PIN=5    ; złącze Grove I2C na XIAO ESP32S3
    -DI2C_SCL_PIN=6

; ---------- Aktualizacja przez WiFi (bez kabla USB) ----------
; Wymaga, żeby urządzenie już działało i było w sieci (najpierw jeden raz
; wgrane przez USB środowiskiem powyżej). Hasło poniżej (--auth=...) MUSI
; się zgadzać z OTA_PASSWORD w main.cpp - zmień w obu miejscach na własne.
; Użycie: pio run -e xiao_esp32s3_ota -t upload
[env:xiao_esp32s3_ota]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DI2C_SDA_PIN=5
    -DI2C_SCL_PIN=6
upload_protocol = espota
upload_port = czujnik-powietrza.local
upload_flags = --auth=zmien-to-haslo-123

[env:devkit_v1_ota]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DI2C_SDA_PIN=21
    -DI2C_SCL_PIN=22
upload_protocol = espota
upload_port = czujnik-powietrza.local
upload_flags = --auth=zmien-to-haslo-123